name: 'Setup NetHunter Config'
description: 'Enable conservative NetHunter-compatible GKI config options'

runs:
  using: "composite"
  steps:
    - name: Enable NetHunter core and USB gadget support
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_HID_GENERIC=y

    - name: Enable USB Bluetooth host drivers
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BT=m
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIVHCI=m

    - name: Enable external USB Wi-Fi drivers
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_ATH9K_HTC=m
          CONFIG_CARL9170=m
          CONFIG_MT7601U=m
          CONFIG_RT2X00=m
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RTL8187=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_ZD1211RW=m
          CONFIG_USB_NET_RNDIS_WLAN=m

    - name: Enable USB Ethernet and optional CAN interfaces
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m
          CONFIG_CAN=m
          CONFIG_CAN_RAW=m
          CONFIG_CAN_BCM=m
          CONFIG_CAN_DEV=m
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_MCP251X=m
          CONFIG_CAN_MCP251XFD=m
          CONFIG_CAN_GS_USB=m

    - name: Enable SDR support for supported USB hardware
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_USB_SUPPORT=y
          CONFIG_MEDIA_SDR_SUPPORT=y
          CONFIG_USB_AIRSPY=m
          CONFIG_USB_HACKRF=m
          CONFIG_USB_MSI2500=m
          CONFIG_DVB_RTL2830=m
          CONFIG_DVB_RTL2832=m
          CONFIG_DVB_RTL2832_SDR=m
          CONFIG_DVB_SI2168=m
          CONFIG_DVB_ZD1301_DEMOD=m
