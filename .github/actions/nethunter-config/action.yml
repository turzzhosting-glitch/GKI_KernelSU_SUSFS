name: 'Setup NetHunter Config'
description: 'Enable only firmware-proven NetHunter baseline options for X6853 MT6789 GKI 6.12'

runs:
  using: "composite"
  steps:
    - name: Preserve the XOS 16 NetHunter-compatible baseline
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_HID_GENERIC=y
          CONFIG_TUN=y
          CONFIG_VETH=y
          CONFIG_WIREGUARD=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NAMESPACES=y
          CONFIG_SECCOMP=y
          CONFIG_NETFILTER=y
