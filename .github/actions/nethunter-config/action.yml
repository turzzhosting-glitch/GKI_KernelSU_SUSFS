name: 'Setup NetHunter Config'
description: 'Enable only firmware-proven NetHunter baseline options for X6853 MT6789 GKI 6.12'

inputs:
  experimental:
    required: false
    default: 'false'
    description: 'Opt-in protocol-only additions: BNEP, VHCI, and CAN ISO-TP'

runs:
  using: "composite"
  steps:
    - name: Preserve the XOS 16 NetHunter-compatible baseline
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_ACM=m
          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_HID_GENERIC=y
          CONFIG_CAN=m
          CONFIG_CAN_RAW=m
          CONFIG_CAN_BCM=m
          CONFIG_CAN_GW=m
          CONFIG_CAN_DEV=m
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_TUN=y
          CONFIG_VETH=y
          CONFIG_WIREGUARD=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NAMESPACES=y
          CONFIG_SECCOMP=y
          CONFIG_NETFILTER=y

    - name: Enable protocol-only NetHunter experiment
      if: inputs.experimental == 'true'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # These do not replace MediaTek vendor hardware drivers.
          CONFIG_BT_BNEP=m
          CONFIG_BT_HCIVHCI=m
          CONFIG_CAN_ISOTP=m
