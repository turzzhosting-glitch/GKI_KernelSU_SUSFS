name: Set Kernel Config
description: Patch gki_defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch gki_defconfig
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      DEFCONFIG="arch/arm64/configs/gki_defconfig"
      CONFIG_LIST="${{ inputs.config_list }}"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: gki_defconfig not found"
        exit 1
      fi

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        # skip empty/comments
        [[ -z "$line" || "$line" == \#* ]] && return

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        echo "Processing: $key=$value"

        # if config exists anywhere in file → replace it
        if grep -q "^$key=" "$DEFCONFIG"; then
          sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
        elif grep -q "^# $key is not set" "$DEFCONFIG"; then
          sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
        else
          # not present → append
          echo "$key=$value" >> "$DEFCONFIG"
        fi
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"

      # Fail closed if a requested symbol was not written exactly. This avoids
      # reporting success when Kconfig renamed/ignored a symbol.
      while IFS= read -r line || [ -n "$line" ]; do
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        [[ -z "$line" || "$line" == \#* ]] && continue
        key="${line%%=*}"
        value="${line#*=}"
        if ! grep -qE "^${key}=${value}$" "$DEFCONFIG"; then
          echo "ERROR: config gate failed: ${key}=${value} is absent from ${DEFCONFIG}" >&2
          exit 1
        fi
      done <<< "$CONFIG_LIST"
