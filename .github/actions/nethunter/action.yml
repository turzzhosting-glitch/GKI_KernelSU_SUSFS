name: NetHunter Baseline

description: Enable generic NetHunter kernel capabilities without device-specific Wi-Fi drivers

runs:
  using: composite
  steps:
    - name: Enable NetHunter baseline configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_TUN=y
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_UHID=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
          CONFIG_USB_DWC3_GADGET=y
          CONFIG_USB_GADGETFS=y
          CONFIG_USB_FUNCTIONFS=y
          CONFIG_USB_FUNCTIONFS_ETH=y
          CONFIG_USB_FUNCTIONFS_RNDIS=y
          CONFIG_USB_NET_RNDIS_HOST=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_BT=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_BNEP=y
          # Android GKI 6.12 packaging does not ship net/bluetooth/hidp/hidp.ko;
          # USB HID gadget support below remains enabled for NetHunter HID attacks.
          CONFIG_BT_HIDP=n
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_WEXT_CORE=y
          CONFIG_WEXT_PROC=y
          CONFIG_WEXT_SPY=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_NET_SCH_HTB=y
          CONFIG_NET_SCH_NETEM=y
          CONFIG_CGROUPS=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y
